name: Release APK

on:
  push:
    tags:
      - 'v*'              # 打 tag 自动触发，如 v1.0.0 v1.2.3
  workflow_dispatch:       # 也可手动触发
    inputs:
      tag:
        description: 'Release 版本号（如 v1.0.0）'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove proxy settings for CI
        run: sed -i '/systemProp\./d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: BiscuitBag ${{ steps.tag.outputs.tag }}
          body: |
            ## 饼干袋 ${{ steps.tag.outputs.tag }}

            基于 commit ${{ github.sha }} 自动构建。

            ### 下载

            - [BiscuitBag-release.apk](https://github.com/QWM-0/BiscuitBag/releases/download/${{ steps.tag.outputs.tag }}/BiscuitBag-release.apk) — Release APK，直接安装到 Android 设备

            ### 安装说明

            1. 下载 APK 文件
            2. 在手机上打开，允许「安装未知来源应用」
            3. 安装完成后即可使用

            > 如果下载速度慢，可将链接中的 `github.com` 替换为 `hub.fastgit.org` 加速。
          files: composeApp/build/outputs/apk/release/*.apk
